# ═══════════════════════════════════════════════════════════════
# Tuned DWA Local Planner Parameters for TurtleBot 3 Burger
# High obstacle avoidance weight (occdist_scale: 0.08)
# prevents grazing or clashing with pillars
# ═══════════════════════════════════════════════════════════════

DWAPlannerROS:

# Robot Configuration Parameters
  max_vel_x: 0.20
  min_vel_x: -0.15

  max_vel_y: 0.0
  min_vel_y: 0.0

# Velocity in straight line & rotation
  max_vel_trans:  0.20
  min_vel_trans:  0.05

  max_vel_theta: 2.50
  min_vel_theta: 0.40

  acc_lim_x: 2.0
  acc_lim_y: 0.0
  acc_lim_theta: 3.2

# Goal Tolerance Parameters
  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.17
  latch_xy_goal_tolerance: false

# Forward Simulation Parameters
  sim_time: 1.8
  vx_samples: 25
  vy_samples: 0
  vth_samples: 40
  controller_frequency: 10.0

# Trajectory Scoring Parameters (Tuned for safe obstacle clearance)
  path_distance_bias: 28.0
  goal_distance_bias: 18.0
  occdist_scale: 0.08
  forward_point_distance: 0.30
  stop_time_buffer: 0.35
  scaling_speed: 0.20
  max_scaling_factor: 0.2

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05

# Debugging
  publish_traj_pc : true
  publish_cost_grid_pc: false
