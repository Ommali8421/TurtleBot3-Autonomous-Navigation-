# ═══════════════════════════════════════════════════════════════
# Tuned Costmap Parameters for TurtleBot 3 Burger
# Appropriate inflation radius (0.40m) leaves 80cm clear corridors
# between the 1.1m-spaced pillars in turtlebot3_world
# ═══════════════════════════════════════════════════════════════

obstacle_range: 3.0
raytrace_range: 3.5

# Circular footprint for TurtleBot 3 Burger (10.5 cm radius + 2 cm padding)
robot_radius: 0.105
footprint_padding: 0.02

# Tuned inflation clearance: keeps 80cm open corridors between the 9 pillars
inflation_radius: 0.40
cost_scaling_factor: 3.5

map_type: costmap
observation_sources: scan
scan: {sensor_frame: base_scan, data_type: LaserScan, topic: scan, marking: true, clearing: true}
